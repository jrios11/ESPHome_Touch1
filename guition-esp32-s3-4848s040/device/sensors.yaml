# =============================================================================
# SENSORS - Home Assistant State Synchronization
# =============================================================================
# Monitors Home Assistant entities and keeps touchscreen buttons in sync.
# Each sensor here has a matching button in lvgl.yaml.
# =============================================================================

sensor:

  # ===========================================================================
  # SENSOR: Outside Temperature (OpenWeatherMap Durham feels like)
  # ===========================================================================
  # Updates the temperature label top-left: "outside° / inside°"
  # ===========================================================================
  - platform: homeassistant
    entity_id: sensor.openweathermap_durham_feels_like_temperature
    id: outdoor_temperature
    on_value:
      - lvgl.label.update:
          id: temperatures
          text:
            format: "%d°F outside / %d°F inside"
            args: [ '(int)round(x)', '(int)round(id(inside_temperature).state)' ]

  # ===========================================================================
  # SENSOR: Inside Temperature (hub3)
  # ===========================================================================
  # Updates the temperature label top-left: "outside° / inside°"
  # ===========================================================================
  - platform: homeassistant
    entity_id: sensor.hub3_temperature
    id: inside_temperature
    on_value:
      - lvgl.label.update:
          id: temperatures
          text:
            format: "%d°F outside / %d°F inside"
            args: [ '(int)round(id(outdoor_temperature).state)', '(int)round(x)' ]


# =============================================================================
# BINARY SENSORS (Switch / Fan on/off states)
# =============================================================================

binary_sensor:

  # ===========================================================================
  # SENSOR: Desk Lamp (Zigbee switch)
  # ===========================================================================
  # Watches switch.0xffffb40e06055a65 and highlights the desk lamp button
  # when the switch is ON.
  # ===========================================================================
  - platform: homeassistant
    id: desk_lamp_state
    entity_id: switch.0xffffb40e06055a65
    trigger_on_initial_state: true
    on_state:
      then:
        - lvgl.widget.update:
            id: desk_lamp_button
            state:
             checked: !lambda return x == "on";
  # ===========================================================================
  # SENSOR: Air Purifier Fan
  # ===========================================================================
  # Watches fan.air_purifier_2 and highlights the air purifier button
  # when the fan is ON.
  # ===========================================================================
  - platform: homeassistant
    id: air_purifier_state
    entity_id: fan.air_purifier_2
    trigger_on_initial_state: true
    on_state:
      then:
        - lvgl.widget.update:
            id: air_purifier_button
            state:
              checked: !lambda return x;


# =============================================================================
# TEXT SENSORS (String state values)
# =============================================================================

text_sensor:

  # ===========================================================================
  # SENSOR: PC Session State
  # ===========================================================================
  # Watches sensor.rios_1_sessionstate.
  # When the value equals "Locked", the Lock PC button appears checked/active.
  # Common values: "Locked", "Unlocked", "Active" — verify yours in
  # Developer Tools → States in Home Assistant.
  # ===========================================================================
  - platform: homeassistant
    id: pc_session_state
    entity_id: sensor.rios_1_sessionstate
    on_value:
      then:
        - lvgl.widget.update:
            id: lock_pc_button
            state:
              checked: !lambda return x == "Locked";
