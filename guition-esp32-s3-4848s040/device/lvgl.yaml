# =============================================================================
# LVGL TOUCHSCREEN INTERFACE
# =============================================================================
# Stripped down to Rio's entities only.
# Keeps the original repo's styling patterns exactly:
#   - top_layer for temps + clock
#   - 3-column grid layout for buttons
#   - homeassistant.service calls on_press/on_click
#   - Matching sensor IDs from sensors.yaml
# =============================================================================

lvgl:
  buffer_size: 100%
  top_layer:
    widgets:

      # =========================================================================
      # TEMPERATURE DISPLAY (Top-left)
      # =========================================================================
      # Shows "outside° / inside°"
      # Updated by both temperature sensors in sensors.yaml.
      # =========================================================================
      - label:
          text: "-°F outside / -°F inside"
          id: temperatures
          styles: roboto15_style
          align: top_left
          x: 8
          y: 4
          text_color: 0xFFFFFF

      # =========================================================================
      # CLOCK DISPLAY (Top-center)
      # =========================================================================
      # Time is synced from Home Assistant via addon/time.yaml (EST timezone).
      # Set timezone to America/New_York in the time addon config.
      # =========================================================================
      - label:
          text: "--:--"
          id: display_time
          styles: roboto15_style
          align: top_mid
          x: 0
          y: 4
          text_align: center
          text_color: 0xFFFFFF

  pages:
    - id: main_page
      layout:
        type: grid
        grid_columns: [fr(1), fr(1), fr(1)]
        grid_rows: [fr(1), fr(1), fr(1)]
      scrollbar_mode: "off"
      scroll_dir: "hor"
      width: 100%
      bg_color: Black
      bg_opa: cover
      pad_top: 34
      pad_bottom: 5
      pad_left: 5
      pad_right: 5

      widgets:

        # =========================================================================
        # BUTTON: Lock PC
        # =========================================================================
        # WHAT THIS BUTTON DOES:
        #   Presses button.rios_1_lockpc in Home Assistant, which triggers
        #   the MQTT button that locks the PC.
        #
        # WHEN PRESSED:
        #   Calls Home Assistant service: button.press
        #   Target: button.rios_1_lockpc
        #
        # HOW THE BUTTON KNOWS IF IT'S ACTIVE:
        #   sensors.yaml monitors: sensor.rios_1_sessionstate
        #   When that sensor equals "Locked", this button appears checked (highlighted).
        # =========================================================================
        - button:
            height: $button_height_single
            width: $button_width
            checkable: true
            id: lock_pc_button
            styles: control
            grid_cell_column_pos: 0
            grid_cell_row_pos: 0
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $lock
              - label:
                  align: bottom_left
                  text: "Lock PC"
            on_press:
              - homeassistant.service:
                  service: button.press
                  data:
                    entity_id: button.rios_1_lockpc

        # =========================================================================
        # BUTTON: Desk Lamp
        # =========================================================================
        # WHAT THIS BUTTON DOES:
        #   Toggles the Zigbee desk lamp switch on or off.
        #
        # WHEN PRESSED:
        #   Calls Home Assistant service: switch.toggle
        #   Target: switch.0xffffb40e06055a65
        #
        # HOW THE BUTTON KNOWS IF IT'S ACTIVE:
        #   sensors.yaml monitors: switch.0xffffb40e06055a65
        #   When ON, this button appears checked (highlighted).
        # =========================================================================
        - button:
            height: $button_height_single
            width: $button_width
            checkable: true
            id: desk_lamp_button
            styles: control
            grid_cell_column_pos: 1
            grid_cell_row_pos: 0
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $lightbulb
              - label:
                  align: bottom_left
                  text: "Desk Lamp"
            on_press:
              - homeassistant.service:
                  service: switch.toggle
                  data:
                    entity_id: switch.0xffffb40e06055a65

        # =========================================================================
        # BUTTON: Air Purifier
        # =========================================================================
        # WHAT THIS BUTTON DOES:
        #   Toggles the air purifier fan on or off.
        #
        # WHEN PRESSED:
        #   Calls Home Assistant service: fan.toggle
        #   Target: fan.air_purifier_2
        #
        # HOW THE BUTTON KNOWS IF IT'S ACTIVE:
        #   sensors.yaml monitors: fan.air_purifier_2
        #   When ON, this button appears checked (highlighted).
        # =========================================================================
        - button:
            height: $button_height_single
            width: $button_width
            checkable: true
            id: air_purifier_button
            styles: control
            grid_cell_column_pos: 2
            grid_cell_row_pos: 0
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $air_purifier
              - label:
                  align: bottom_left
                  text: "Air Purifier"
            on_press:
              - homeassistant.service:
                  service: fan.toggle
                  data:
                    entity_id: fan.air_purifier_2
